- name: Install jq
  hosts: all
  tasks:
    - name: Download jq
      ansible.builtin.get_url:
        url: https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
        dest: /usr/local/bin/jq
        mode: "0755"
        checksum: "sha256:020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d"
